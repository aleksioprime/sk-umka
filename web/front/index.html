<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UMKA - мониторинг</title>
  <style>
    :root { --bg: #062f2f; --card: #0a3d3b; --line: rgba(45, 212, 191, .25); --accent: #2dd4bf;
            --text: #e6fffa; --muted: #9fbfbf; --ok: #22c55e; --off: #ef4444; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: sans-serif; }
    header { padding: 16px; border-bottom: 1px solid var(--line); display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
    h1 { margin: 0; font-size: 22px; }
    main { max-width: 1100px; margin: 0 auto; padding: 16px; }
    .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 140px), 1fr)); gap: 10px; margin-bottom: 16px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
    .card b { display: block; font-size: 26px; color: var(--accent); }
    .card span { color: var(--muted); font-size: 13px; }
    table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 12px; overflow: hidden; }
    th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--line); font-size: 14px; }
    th { color: var(--muted); font-weight: normal; }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
    .muted { color: var(--muted); }
    @media (max-width: 700px) { .wide { display: none; } }
    .login { max-width: 340px; margin: 12vh auto; }
    .login h2 { margin: 0 0 16px; }
    .login input { width: 100%; margin-bottom: 10px; padding: 10px 12px; border-radius: 10px; font: inherit;
                   border: 1px solid var(--line); background: #062f2f; color: var(--text); }
    .login button, .logout { padding: 10px 16px; border: 0; border-radius: 10px; font: inherit; cursor: pointer;
                             background: var(--accent); color: #062f2f; font-weight: bold; }
    .login button { width: 100%; }
    .logout { margin-left: auto; padding: 6px 12px; background: transparent; color: var(--accent);
              border: 1px solid var(--line); font-weight: normal; }
    .error { color: #fca5a5; min-height: 1.2em; margin: 8px 0 0; }
    .layout { max-width: 1600px; margin: 0 auto; }
    .layout:has(.device-panel:not([hidden])) {
      display: grid; grid-template-columns: minmax(0, 1fr) clamp(430px, 44vw, 620px);
    }
    .layout:has(.device-panel:not([hidden])) main { width: 100%; }
    tr[data-device] { cursor: pointer; }
    tr[data-device]:hover, tr[data-device].selected { background: #104b48; }
    .device-link { text-align: left; color: var(--text); background: none; border: 0; padding: 3px 0;
                   cursor: pointer; font: inherit; font-weight: bold; }
    .device-link:hover { color: var(--accent); text-decoration: underline; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .device-panel { position: sticky; top: 0; height: 100dvh; min-width: 0; display: flex; flex-direction: column;
                    background: #083835; border-left: 1px solid var(--line); box-shadow: -12px 0 32px #031d1b77; }
    .panel-header { display: flex; gap: 14px; justify-content: space-between; align-items: flex-start; padding: 20px; }
    .panel-header h2 { margin: 0 0 6px; font-size: 22px; overflow-wrap: anywhere; }
    #device-meta { margin: 8px 0 0; font-size: 14px; }
    .panel-button, .panel-filters select { border: 1px solid var(--line); border-radius: 8px; min-height: 42px;
      background: #0a3d3b; color: var(--text); font: inherit; padding: 8px 12px; }
    .panel-button { cursor: pointer; }
    .panel-button:hover:not(:disabled) { border-color: var(--accent); }
    .panel-button:disabled { opacity: .6; }
    .panel-button[aria-pressed="true"] { background: var(--accent); color: var(--bg); }
    .panel-nav { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 20px 14px; border-bottom: 1px solid var(--line); }
    .panel-body { padding: 16px 20px 24px; overflow-y: auto; overscroll-behavior: contain; min-height: 0; }
    .panel-body h3 { margin: 16px 0 8px; font-size: 16px; }
    .panel-body h3:first-child { margin-top: 0; }
    .panel-summary { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .panel-summary .card b { font-size: 23px; }
    .detail-list { margin: 0; }
    .detail-list div { display: grid; grid-template-columns: minmax(90px, 2fr) minmax(0, 3fr);
                       gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .detail-list dt { color: var(--muted); }
    .detail-list dd { margin: 0; overflow-wrap: anywhere; }
    .panel-filters { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .panel-filters label { display: grid; gap: 5px; min-width: 0; color: var(--muted); font-size: 13px; }
    .panel-filters select { width: 100%; font-size: 14px; padding-inline: 6px; }
    .journal-toolbar { display: flex; gap: 10px; align-items: center; justify-content: space-between; margin: 12px 0; }
    .journal-toolbar p { margin: 0; }
    .sort-list { list-style: none; padding: 0; margin: 0 0 12px; display: grid; gap: 8px; }
    .sort-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: start; gap: 6px 12px; }
    .sort-item strong { overflow-wrap: anywhere; }
    .sort-item small { grid-column: 1 / -1; color: var(--muted); font-size: 13px; }
    .sort-item .yes { color: #86efac; }
    .sort-item .no { color: #fca5a5; }
    .sort-item .unanswered { color: var(--muted); }
    .admin-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    .admin-actions .panel-button { min-height: 38px; }
    .device-management { margin: 0 0 16px; }
    .device-management .admin-actions { margin-bottom: 0; }
    .admin-form { display: grid; gap: 10px; margin-top: 12px; }
    .admin-form label, .mqtt-filters label { display: grid; gap: 5px; color: var(--muted); font-size: 14px; }
    .admin-form input, .mqtt-filters :is(input, select) {
      min-width: 0; width: 100%; min-height: 42px; padding: 8px; color: var(--text); background: var(--bg);
      border: 1px solid var(--line); border-radius: 8px; font: inherit;
    }
    .admin-form .error, .mqtt-dialog .error { min-height: 0; margin: 0; }
    .danger { color: #fecaca; border-color: #ef44447d; }
    .admin-dialog { background: #083835; color: var(--text); border: 1px solid var(--line); border-radius: 14px;
                    padding: 18px; width: min(440px, calc(100vw - 20px)); max-height: calc(100dvh - 20px); }
    .admin-dialog::backdrop { background: #021817b8; }
    .admin-dialog h2 { margin: 0; font-size: 20px; }
    .admin-dialog .panel-header { padding: 0 0 12px; align-items: center; }
    .admin-dialog .admin-actions { margin-bottom: 0; }
    .mqtt-dialog { width: min(780px, calc(100vw - 20px)); }
    .mqtt-filters { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .mqtt-filters .admin-actions { grid-column: 1 / -1; }
    .mqtt-entry summary { cursor: pointer; overflow-wrap: anywhere; }
    .mqtt-entry small { display: block; color: var(--muted); margin-top: 4px; }
    .mqtt-entry pre { padding: 10px; background: var(--bg); max-height: 18rem; overflow: auto;
                     white-space: pre-wrap; overflow-wrap: anywhere; }
    @media (max-width: 1050px) { .layout:has(.device-panel:not([hidden])) .wide { display: none; } }
    @media (max-width: 780px) {
      .layout:has(.device-panel:not([hidden])) { display: block; }
      .device-panel { position: fixed; inset: 0; z-index: 1; border: 0; }
      body:has(.device-panel:not([hidden])) { overflow: hidden; }
      .panel-header, .panel-body { padding-inline: 14px; }
      .panel-nav { padding-inline: 14px; gap: 5px; }
    }
    @media (max-width: 350px) { .panel-filters { grid-template-columns: 1fr; } }
    [hidden] { display: none !important; }
  </style>
</head>

<body>
  <header id="site-header">
    <h1>UMKA - сеть умных мусорок</h1>
    <span class="muted" id="updated"></span>
    <button class="logout" id="logout" hidden>Выйти</button>
  </header>
  <form class="login card" id="login" hidden>
    <h2>Вход</h2>
    <input id="username" autocomplete="username" placeholder="Логин" required>
    <input id="password" type="password" autocomplete="current-password" placeholder="Пароль" required>
    <button type="submit">Войти</button>
    <p class="error" id="login-error"></p>
  </form>
  <div class="layout">
    <main id="dashboard" hidden>
      <div class="summary" id="summary"></div>
      <div class="admin-actions" data-admin hidden>
        <button id="register-device" type="button" class="panel-button">Добавить устройство</button>
        <button id="open-mqtt" type="button" class="panel-button">Журнал MQTT</button>
        <p class="muted" id="admin-result" role="status" hidden></p>
      </div>
      <table>
        <thead><tr><th>Устройство</th><th>Связь</th><th class="wide">Камера / модель / моторы</th><th>Отсортировано</th></tr></thead>
        <tbody id="devices"></tbody>
      </table>
    </main>
    <aside class="device-panel" id="device-panel" aria-labelledby="device-title" hidden>
      <div class="panel-header">
        <div>
          <h2 id="device-title"></h2>
          <span class="muted" id="device-id"></span>
          <p id="device-meta"></p>
        </div>
        <button id="device-close" class="panel-button" type="button" aria-label="Закрыть панель">Закрыть</button>
      </div>
      <nav class="panel-nav" aria-label="Разделы устройства">
        <button type="button" class="panel-button" data-section="overview" aria-controls="overview" aria-pressed="true">Обзор</button>
        <button type="button" class="panel-button" data-section="journal" aria-controls="journal" aria-pressed="false">Журнал</button>
        <button type="button" class="panel-button" data-section="diagnostics" aria-controls="diagnostics" aria-pressed="false">Диагностика</button>
      </nav>
      <div class="panel-body">
        <section id="overview" aria-label="Обзор">
          <section class="device-management" data-admin aria-label="Управление устройством" hidden>
            <div class="admin-actions">
              <button id="edit-device" type="button" class="panel-button">Редактировать</button>
              <button id="delete-device" type="button" class="panel-button danger">Удалить</button>
            </div>
            <form id="device-edit-form" class="admin-form" hidden>
              <label>Имя устройства<input id="edit-device-name" name="name" required maxlength="128"></label>
              <p class="error" role="alert" hidden></p>
              <div class="admin-actions">
                <button class="panel-button" type="submit">Сохранить имя</button>
                <button class="panel-button" type="button" data-cancel>Отмена</button>
              </div>
            </form>
            <form id="device-delete-form" class="admin-form" hidden>
              <span id="delete-device-confirm"></span>
              <p class="error" role="alert" hidden></p>
              <div class="admin-actions">
                <button class="panel-button danger" type="submit">Удалить устройство</button>
                <button class="panel-button" type="button" data-cancel>Отмена</button>
              </div>
            </form>
          </section>
          <div class="panel-summary" id="device-stats"></div>
          <h3>Счётчики по видам отходов</h3>
          <dl class="detail-list" id="device-types"></dl>
        </section>
        <section id="journal" aria-label="Журнал сортировок" hidden>
          <div class="panel-filters" id="journal-filters">
            <label>Период
              <select id="journal-days">
                <option value="0">Всё время</option><option value="7">7 дней</option><option value="30">30 дней</option>
              </select>
            </label>
            <label>Вид отходов<select id="journal-type"><option value="">Все виды</option></select></label>
            <label>Ответ
              <select id="journal-answer">
                <option value="">Все ответы</option><option value="yes">Да</option><option value="no">Нет</option>
                <option value="none">Без ответа</option>
              </select>
            </label>
          </div>
          <div class="journal-toolbar">
            <p class="muted" id="journal-message" role="status"></p>
            <button type="button" class="panel-button" id="journal-refresh">Обновить</button>
          </div>
          <ol class="sort-list" id="sort-list"></ol>
          <button type="button" class="panel-button" id="journal-more" hidden>Показать ещё</button>
        </section>
        <section id="diagnostics" aria-label="Диагностика" hidden>
          <dl class="detail-list" id="device-diagnostics"></dl>
        </section>
      </div>
    </aside>
  </div>
  <dialog id="register-dialog" class="admin-dialog" aria-labelledby="register-title">
    <div class="panel-header">
      <h2 id="register-title">Добавить устройство</h2>
      <button class="panel-button" type="button" data-close>Закрыть</button>
    </div>
    <form id="device-register-form" class="admin-form">
      <label>Идентификатор MQTT
        <input name="id" placeholder="umka-rpi5" aria-describedby="device-id-hint" pattern="[A-Za-z0-9_\-]+" required maxlength="64" autofocus>
      </label>
      <small class="muted" id="device-id-hint">Укажите device_id из файла umka.conf. Латиница, цифры, дефис и подчёркивание.</small>
      <label>Имя устройства<input name="name" required maxlength="128"></label>
      <p class="error" role="alert" hidden></p>
      <div class="admin-actions"><button class="panel-button" type="submit">Добавить</button></div>
    </form>
  </dialog>
  <dialog id="mqtt-dialog" class="admin-dialog mqtt-dialog" aria-labelledby="mqtt-title">
    <div class="panel-header">
      <h2 id="mqtt-title">Журнал MQTT</h2>
      <button class="panel-button" type="button" data-close>Закрыть</button>
    </div>
    <form id="mqtt-filters" class="mqtt-filters">
      <label>Период
        <select name="hours">
          <option value="1">Последний час</option><option selected value="24">Последние сутки</option>
          <option value="168">7 дней</option><option value="0">Всё время</option>
        </select>
      </label>
      <label>Результат
        <select name="result">
          <option value="">Любой</option>
          <option value="accepted">Принято</option><option value="unregistered">Устройство не зарегистрировано</option>
          <option value="invalid">Некорректное сообщение</option><option value="unsupported">Неподдерживаемый топик</option>
          <option value="duplicate">Повтор события</option>
        </select>
      </label>
      <label>Идентификатор устройства<input name="device_id" placeholder="umka-rpi5" maxlength="256"></label>
      <label>Топик содержит<input name="topic" placeholder="/status" maxlength="256"></label>
      <div class="admin-actions"><button class="panel-button" type="submit">Показать сообщения</button></div>
    </form>
    <p id="mqtt-message" class="muted" role="status"></p>
    <ol id="mqtt-list" class="sort-list"></ol>
    <button type="button" id="mqtt-more" class="panel-button" hidden>Показать ещё</button>
  </dialog>
  <script src="/admin.js"></script>
  <script>
    const TYPES = { paper: "Бумага", plastic_aluminum: "Пластик/алюминий", organic: "Органика", non_recyclable: "Несортируемые" };
    const SORT_STATES = {
      IDLE: "Площадка свободна", CANDIDATE: "Проверка предмета", SORTING: "Сортировка",
      WAITING_FOR_REMOVAL: "Ожидание освобождения площадки",
    };
    const escape = (value) => String(value ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
    const ok = (part) => part ? (part.ok === false ? "✕" : "✓") : "-";
    const typeName = (type) => Object.hasOwn(TYPES, type) ? TYPES[type] : (type || "Не указан");
    const number = (value) => typeof value === "number" ? new Intl.NumberFormat("ru-RU").format(value) : "—";
    const time = (value) => value && Number.isFinite(Date.parse(value))
      ? new Date(value).toLocaleString("ru-RU") : "—";

    // Авторизация как в empolimer: access-токен в заголовке, refresh - чтобы
    // получить новый access, когда старый истёк (30 минут).
    const $ = (id) => document.getElementById(id);
    let devices = [];
    let selected = null;
    let journalVersion = 0;
    let listMarkup = "";
    let refreshVersion = 0;
    const mobile = matchMedia("(max-width: 780px)");
    const panel = $("device-panel");
    const tokens = {
      get access() { return localStorage.getItem("umka-access"); },
      get refresh() { return localStorage.getItem("umka-refresh"); },
      save(data) {
        if (data.access_token) localStorage.setItem("umka-access", data.access_token);
        if (data.refresh_token) localStorage.setItem("umka-refresh", data.refresh_token);
      },
      clear() { localStorage.removeItem("umka-access"); localStorage.removeItem("umka-refresh"); },
    };

    async function renewAccess() {
      if (!tokens.refresh) return false;
      const response = await fetch("/api/auth/refresh", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ refresh_token: tokens.refresh }),
      });
      if (!response.ok) return false;
      tokens.save(await response.json());
      return true;
    }

    async function api(path, method = "GET", body) {
      const call = () => fetch(path, {
        method, cache: "no-store", body: body === undefined ? undefined : JSON.stringify(body),
        headers: { Authorization: `Bearer ${tokens.access}`, "Content-Type": "application/json" },
      });
      let response = await call();
      if (response.status === 401 && await renewAccess()) response = await call();
      if (response.status === 401) { showLogin(); throw new Error("Нужен вход"); }
      if (!response.ok) {
        const error = await response.json().catch(() => ({}));
        throw new Error(typeof error.detail === "string" ? error.detail : `HTTP ${response.status}`);
      }
      if (response.status === 204) return;
      return response.json();
    }

    function showLogin(message = "") {
      closePanel(false);
      setAdmin(false);
      refreshVersion++;
      devices = [];
      listMarkup = "";
      $("devices").replaceChildren();
      tokens.clear();
      $("dashboard").hidden = true;
      $("logout").hidden = true;
      $("login").hidden = false;
      $("updated").textContent = "";
      $("login-error").textContent = message;
    }

    async function showDashboard() {
      $("login").hidden = true;
      $("dashboard").hidden = false;
      $("logout").hidden = false;
      try {
        const me = await api("/api/auth/me");
        $("logout").textContent = `Выйти (${me.username})`;
        setAdmin(me.is_admin);
      } catch (error) { return; }
      refresh();
    }

    $("login").addEventListener("submit", async (event) => {
      event.preventDefault();
      const response = await fetch("/api/auth/login", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: $("username").value, password: $("password").value }),
      });
      if (!response.ok) {
        $("login-error").textContent = "Неверный логин или пароль";
        return;
      }
      tokens.save(await response.json());
      $("password").value = "";
      showDashboard();
    });

    $("logout").addEventListener("click", async () => {
      if (tokens.refresh) {
        await fetch("/api/auth/logout", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ refresh_token: tokens.refresh }),
        }).catch(() => {});
      }
      showLogin();
    });

    function renderDevices() {
      const markup = devices.length ? devices.map((device) => {
        const status = device.status || {};
        return `<tr data-device="${escape(device.id)}">
          <td><button type="button" class="device-link" aria-controls="device-panel" aria-expanded="false">${escape(device.name || device.id)}</button>
            <br><span class="muted">${escape(device.id)}</span></td>
          <td><span class="dot" style="background:${device.online ? "var(--ok)" : "var(--off)"}"></span>${device.online ? "онлайн" : "нет связи"}
            <br><span class="muted">${escape(time(device.lastSeen))}</span></td>
          <td class="wide">${ok(status.camera)} / ${ok(status.model)} / ${ok(status.hardware)} ${escape(status.hardware?.driver || "")}</td>
          <td>${escape(status.stats?.total_items ?? "—")}</td></tr>`;
      }).join("") : `<tr><td colspan="4" class="muted">Зарегистрированных устройств пока нет</td></tr>`;
      if (markup !== listMarkup) {
        const focused = document.activeElement.closest("tr[data-device]")?.dataset.device;
        $("devices").innerHTML = listMarkup = markup;
        if (focused) deviceButton(focused)?.focus({ preventScroll: true });
      }
      for (const row of $("devices").querySelectorAll("tr[data-device]")) {
        const active = row.dataset.device === selected?.id;
        row.classList.toggle("selected", active);
        row.querySelector("button").setAttribute("aria-expanded", active);
      }
    }

    function deviceButton(id) {
      return $("devices").querySelector(`tr[data-device="${CSS.escape(id)}"] button`);
    }

    function setPanelLayout() {
      const modal = mobile.matches && !panel.hidden;
      $("site-header").inert = $("dashboard").inert = modal;
      panel.setAttribute("role", modal ? "dialog" : "complementary");
      if (modal) panel.setAttribute("aria-modal", "true");
      else panel.removeAttribute("aria-modal");
      if (modal && !panel.contains(document.activeElement)) $("device-close").focus();
    }

    function detailRows(rows) {
      return rows.map(([label, value]) => `<div><dt>${escape(label)}</dt><dd>${escape(value)}</dd></div>`).join("");
    }

    function renderPanel(device) {
      const status = device.status || {};
      const stats = status.stats || {};
      $("device-title").textContent = device.name || device.id;
      $("device-id").textContent = device.id;
      $("device-meta").innerHTML = `<span class="dot" style="background:${device.online ? "var(--ok)" : "var(--off)"}"></span>
        ${device.online ? "Онлайн" : "Нет связи"} · последнее сообщение ${escape(time(device.lastSeen))}`;
      const weight = number(stats.estimated_weight_kg);
      $("device-stats").innerHTML = [
        [number(stats.total_items), "Предметов по счётчику устройства"],
        [number(selected.total), "Сортировок в журнале сервера"],
        [weight === "—" ? weight : weight + " кг", "Ориентировочная масса"],
        [stats.feedback ? `${number(stats.feedback.correct)} / ${number(stats.feedback.incorrect)}` : "—", "Ответы «Да» / «Нет» по счётчику"],
      ].map(([value, label]) => `<div class="card"><b>${escape(value)}</b><span>${label}</span></div>`).join("");
      const types = Object.entries(stats.by_type || {});
      $("device-types").innerHTML = types.length
        ? detailRows(types.map(([type, count]) => [typeName(type), number(count)]))
        : detailRows([["Категории", "Нет данных"]]);
      const component = (part) => {
        if (typeof part?.ok !== "boolean") return "Нет данных";
        return [part.ok ? "В норме" : "Требует внимания", part.driver, part.message].filter(Boolean).join(" · ");
      };
      const mode = status.controllerState;
      $("device-diagnostics").innerHTML = detailRows([
        ["Камера", component(status.camera)], ["Модель", component(status.model)], ["Моторы", component(status.hardware)],
        ["Режим сортировки", Object.hasOwn(SORT_STATES, mode) ? SORT_STATES[mode] : mode || "Нет данных"],
        ["Последнее действие", status.lastAction || "—"],
        ["Ошибка", status.error || (device.status ? "Не сообщалась" : "Нет данных")],
      ]);
    }

    function showSection(id) {
      for (const button of panel.querySelectorAll("[data-section]")) {
        const active = button.dataset.section === id;
        button.setAttribute("aria-pressed", active);
        $(button.dataset.section).hidden = !active;
      }
      panel.querySelector(".panel-body").scrollTop = 0;
    }

    function openPanel(id) {
      const device = devices.find((item) => item.id === id);
      if (!device || selected?.id === id) return;
      selected = { id, total: null };
      resetDeviceManagement();
      for (const select of $("journal-filters").querySelectorAll("select")) select.selectedIndex = 0;
      showSection("overview");
      panel.hidden = false;
      setPanelLayout();
      renderDevices();
      renderPanel(device);
      $("device-close").focus();
      loadJournal();
    }

    function closePanel(restoreFocus = true) {
      if (!selected) return;
      const id = selected.id;
      selected = null;
      resetDeviceManagement();
      journalVersion++;
      panel.hidden = true;
      setPanelLayout();
      renderDevices();
      if (restoreFocus) deviceButton(id)?.focus();
    }

    function sortItem(event) {
      const reply = event.answer === "yes" ? ["yes", "Да"] : event.answer === "no" ? ["no", "Нет"] : ["unanswered", "Без ответа"];
      const confidence = typeof event.confidence === "number" ? `Уверенность ${Math.round(event.confidence * 100)}%` : "";
      const section = /^section_\d+$/.test(event.section)
        ? `Секция ${event.section.slice(8)}` : event.section || "";
      const details = [time(event.timestamp), section, confidence].filter(Boolean).join(" · ");
      return `<li class="card sort-item"><strong>${escape(typeName(event.waste_type))}</strong>
        <span class="${reply[0]}">${reply[1]}</span><small>${escape(details)}</small></li>`;
    }

    async function loadJournal(before = null) {
      const device = selected;
      if (!device) return;
      const version = ++journalVersion;
      const more = $("journal-more");
      const message = $("journal-message");
      const query = new URLSearchParams({ days: $("journal-days").value });
      if ($("journal-type").value) query.set("waste_type", $("journal-type").value);
      if ($("journal-answer").value) query.set("answer", $("journal-answer").value);
      const unfiltered = query.get("days") === "0" && !query.has("waste_type") && !query.has("answer");
      if (before) query.set("before", before);
      else $("sort-list").replaceChildren();
      more.disabled = true;
      message.textContent = "Загрузка журнала…";
      try {
        const data = await api(`/api/devices/${encodeURIComponent(device.id)}/sorts?${query}`);
        if (version !== journalVersion) return;
        $("sort-list").insertAdjacentHTML("beforeend", data.items.map(sortItem).join(""));
        message.textContent = data.total ? `Показано ${$("sort-list").children.length} из ${data.total}` : "Сортировок за этот период с выбранными фильтрами нет";
        if (unfiltered) {
          device.total = data.total;
          renderPanel(devices.find((item) => item.id === device.id));
        }
        more.textContent = "Показать ещё";
        more.hidden = !data.next;
        more.onclick = () => loadJournal(data.next);
      } catch (error) {
        if (version !== journalVersion) return;
        message.textContent = "Не удалось загрузить журнал";
        more.textContent = "Повторить";
        more.hidden = false;
        more.onclick = () => loadJournal(before);
      } finally {
        if (version === journalVersion) more.disabled = false;
      }
    }

    $("devices").addEventListener("click", (event) => {
      const row = event.target.closest("tr[data-device]");
      if (row) openPanel(row.dataset.device);
    });
    $("device-close").addEventListener("click", () => closePanel());
    document.addEventListener("keydown", (event) => {
      if (event.target.closest("dialog[open]")) return;
      if (event.key === "Escape" && selected) closePanel();
      if (event.key !== "Tab" || !selected || !mobile.matches) return;
      const controls = [...panel.querySelectorAll("button:not(:disabled), select, input")].filter((item) => item.getClientRects().length);
      const first = controls[0];
      const last = controls.at(-1);
      if (event.shiftKey ? document.activeElement === first : document.activeElement === last) {
        event.preventDefault();
        (event.shiftKey ? last : first).focus();
      }
    });
    mobile.addEventListener("change", setPanelLayout);
    for (const button of panel.querySelectorAll("[data-section]")) {
      button.addEventListener("click", () => showSection(button.dataset.section));
    }
    $("journal-type").insertAdjacentHTML("beforeend", Object.entries(TYPES)
      .map(([type, label]) => `<option value="${type}">${label}</option>`).join(""));
    $("journal-filters").addEventListener("change", () => loadJournal());
    $("journal-refresh").addEventListener("click", () => loadJournal());

    async function refresh() {
      if ($("dashboard").hidden) return;
      const version = ++refreshVersion;
      try {
        const [items, summary] = await Promise.all([api("/api/devices"), api("/api/summary")]);
        if (version !== refreshVersion) return;
        devices = items;
        const online = devices.filter((d) => d.online).length;
        const cards = [[summary.devices, "устройств"], [online, "на связи"],
          ...Object.entries(summary.sortedByType).map(([type, count]) => [count, typeName(type)])];
        document.getElementById("summary").innerHTML = cards.map(([value, label]) =>
          `<div class="card"><b>${escape(value)}</b><span>${escape(label)}</span></div>`).join("");
        renderDevices();
        if (selected) {
          const device = devices.find((item) => item.id === selected.id);
          if (device) renderPanel(device);
          else closePanel();
        }
        document.getElementById("updated").textContent = `обновлено ${new Date().toLocaleTimeString("ru-RU")}`;
      } catch (error) {
        if (version === refreshVersion) $("updated").textContent = "нет связи с сервером";
      }
    }
    setupAdmin();
    if (tokens.refresh) showDashboard(); else showLogin();
    setInterval(refresh, 10000);
  </script>
</body>

</html>
